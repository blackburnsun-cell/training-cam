name: Capture and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run capture pipeline
        env:
          TZ: Asia/Shanghai
        run: |
          max_retries=2
          attempt=0
          while [ $attempt -le $max_retries ]; do
            echo "--- Attempt $((attempt+1))/$((max_retries+1)) ---"
            if python scripts/hik_pipeline.py 2>&1; then
              echo "Success!"
              exit 0
            fi
            attempt=$((attempt+1))
            if [ $attempt -le $max_retries ]; then
              echo "Failed, retrying in 30s..."
              sleep 30
            fi
          done
          echo "All retries exhausted"
          exit 1

      - name: Commit and push gallery to gh-pages
        run: |
          rm -rf /tmp/gallery
          mv scripts/gallery /tmp/gallery
          find . -not -path './.git/*' -not -name '.git' -delete
          cp -r /tmp/gallery/* .
          rm -rf /tmp/gallery
          touch .nojekyll
          git config user.name "Training Cam Bot"
          git config user.email "bot@training-cam.local"
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new captures, skipping deploy"
            exit 0
          fi
          git add -A
          git commit -m "capture $(date +%Y%m%d-%H%M%S)"
          git push origin HEAD:gh-pages --force

      - name: Self-chain next run (continuous heartbeat)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every successful run chains to the next workflow_dispatch.
          # Wait 13 min (780s) to maintain ~15-min capture cadence.
          # Run time (~2 min) + sleep (13 min) ≈ 15 min total.
          # Note: sleep time is billed, but public repos have unlimited Actions minutes.
          # This is more reliable than schedule cron which GitHub often skips.
          echo "Waiting 13 min before next chain..."
          sleep 780
          gh workflow run "Capture and Deploy" --ref main
          echo "Self-chained next capture at $(date +%Y%m%d-%H%M%S)"
