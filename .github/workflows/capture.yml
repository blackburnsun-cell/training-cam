name: Capture and Deploy

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:  # allows manual trigger too

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run capture pipeline
        run: python scripts/hik_pipeline.py
        env:
          HIK_APP_KEY: ${{ secrets.HIK_APP_KEY }}
          HIK_APP_SECRET: ${{ secrets.HIK_APP_SECRET }}
          HIK_USER_NAME: ${{ secrets.HIK_USER_NAME }}
          HIK_PASSWORD: ${{ secrets.HIK_PASSWORD }}
          HIK_NVR_SERIAL: ${{ secrets.HIK_NVR_SERIAL }}

      - name: Move gallery to root
        run: |
          rm -rf gallery
          mv scripts/gallery gallery
          cp gallery/index.html index.html

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: gallery

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
