name: Capture and Deploy

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run capture pipeline
        run: python scripts/hik_pipeline.py

      - name: Commit and push gallery to gh-pages
        run: |
          # Move gallery to a temp location
          rm -rf /tmp/gallery
          mv scripts/gallery /tmp/gallery
          
          # Remove everything except .git
          find . -not -path './.git/*' -not -name '.git' -delete
          
          # Copy gallery to root
          cp -r /tmp/gallery/* .
          rm -rf /tmp/gallery
          
          # Set git config
          git config user.name "Training Cam Bot"
          git config user.email "bot@training-cam.local"
          
          # Check for changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new captures, skipping deploy"
            exit 0
          fi
          
          # Commit and push to gh-pages
          git add -A
          git commit -m "capture $(date +%Y%m%d-%H%M%S)"
          git push origin HEAD:gh-pages --force
