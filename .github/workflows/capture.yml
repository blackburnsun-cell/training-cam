name: Capture and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Persist tokens across runs so CI reuses a cached User-Access-Token
      # instead of re-running the full (expensive) OAuth flow on every capture.
      # After the capture + deploy steps wipe non-git files, we restore the
      # tokens file from RUNNER_TEMP before saving the cache. This cuts the
      # HikIoT "general API" call volume dramatically so the free quota is
      # no longer exhausted.
      - name: Restore cached token
        id: token-cache
        uses: actions/cache@v4
        with:
          path: |
            scripts/tokens.json
          key: hik-tokens
          restore-keys: |
            hik-tokens

      # The deploy step wipes this repo's non-git files (including
      # scripts/tokens.json), so preserve the token file out-of-band before
      # that happens and put it back the moment checkout/cleanup is done.
      - name: Stash tokens (pre-deploy safety)
        if: steps.token-cache.outputs.cache-hit == 'true' || hashFiles('scripts/tokens.json') != ''
        run: |
          if [ -f scripts/tokens.json ]; then
            mkdir -p /tmp/tok
            cp scripts/tokens.json /tmp/tok/tokens.json
            echo "Stashed tokens.json for reuse"
          else
            echo "No tokens.json to stash"
          fi

      - name: Run capture pipeline
        env:
          TZ: Asia/Shanghai
        run: |
          max_retries=2
          attempt=0
          while [ $attempt -le $max_retries ]; do
            echo "--- Attempt $((attempt+1))/$((max_retries+1)) ---"
            if python scripts/hik_pipeline.py 2>&1; then
              echo "Success!"
              exit 0
            fi
            attempt=$((attempt+1))
            if [ $attempt -le $max_retries ]; then
              echo "Failed, retrying in 30s..."
              sleep 30
            fi
          done
          echo "All retries exhausted"
          exit 1

      - name: Commit and push gallery to gh-pages
        run: |
          rm -rf /tmp/gallery
          mv scripts/gallery /tmp/gallery
          find . -not -path './.git/*' -not -name '.git' -delete
          cp -r /tmp/gallery/* .
          rm -rf /tmp/gallery
          touch .nojekyll
          git config user.name "Training Cam Bot"
          git config user.email "bot@training-cam.local"
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new captures, skipping deploy"
          else
            git add -A
            git commit -m "capture $(date +%Y%m%d-%H%M%S)"
            git push origin HEAD:gh-pages --force
          fi

      - name: Restore stashed token before cache save
        run: |
          if [ -f /tmp/tok/tokens.json ]; then
            mkdir -p scripts
            cp /tmp/tok/tokens.json scripts/tokens.json
            echo "Restored tokens.json to scripts/"
          else
            echo "No stashed token to restore"
          fi

      - name: Save cached token
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            scripts/tokens.json
          key: hik-tokens

      - name: Self-chain next run (continuous heartbeat)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every successful run chains to the next workflow_dispatch.
          # Wait 13 min (780s) to maintain ~15-min capture cadence.
          # Run time (~2 min) + sleep (13 min) ≈ 15 min total.
          # Note: sleep time is billed, but public repos have unlimited Actions minutes.
          # This is more reliable than schedule cron which GitHub often skips.
          echo "Waiting 13 min before next chain..."
          sleep 780
          gh workflow run "Capture and Deploy" --ref main
          echo "Self-chained next capture at $(date +%Y%m%d-%H%M%S)"